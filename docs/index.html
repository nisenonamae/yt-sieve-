<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>関所</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2e5b4e">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --bg:#edeeea; --surface:#f7f8f5; --ink:#16181a; --muted:#6b7075;
  --rule:#cbcec7; --pine:#2e5b4e; --clay:#8c5040; --sand:#b8a06a;
  --jp:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;
  --num:ui-monospace,"SF Mono",Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg);color:var(--ink);font-family:var(--jp);
  font-size:15px;line-height:1.65;
  padding:0 14px calc(env(safe-area-inset-bottom) + 64px);
  max-width:640px;margin:0 auto;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
a{color:var(--pine)}
.num{font-family:var(--num);font-variant-numeric:tabular-nums}

/* ── 見出し ─────────────────────── */
header{padding:20px 0 12px;display:flex;align-items:baseline;gap:12px}
h1{font-size:19px;font-weight:600;letter-spacing:.14em}
#stamp{font-size:11px;color:var(--muted);margin-left:auto}

/* ── タブ ───────────────────────── */
#warn:not(:empty){background:#f6ece6;border:1px solid var(--clay);color:var(--clay);
  padding:9px 11px;font-size:12.5px;line-height:1.6;margin-bottom:10px}
nav{display:flex;gap:2px;border-bottom:1px solid var(--rule);margin-bottom:18px}
nav button{
  padding:9px 13px;font-size:13.5px;color:var(--muted);
  border-bottom:2px solid transparent;margin-bottom:-1px;
}
nav button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--pine);font-weight:600}
nav .badge{font-family:var(--num);font-size:11px;color:var(--muted);margin-left:4px}

/* ── 汎用 ───────────────────────── */
.empty{padding:48px 8px;color:var(--muted);font-size:14px;line-height:1.9}
.empty b{display:block;color:var(--ink);font-weight:600;margin-bottom:6px}
.meta{font-size:12px;color:var(--muted)}
.pill.day{border-color:var(--sand);color:var(--sand)}
.pill.run{border-color:var(--pine);color:var(--pine)}
.pill.back{border-color:var(--clay);color:var(--clay)}
.pill{
  display:inline-block;padding:1px 7px;border:1px solid var(--rule);
  border-radius:2px;font-size:11px;color:var(--muted);
}

/* ── ふるい台 ───────────────────── */
.sieve{background:var(--surface);border:1px solid var(--rule);padding:14px}
.sieve img{width:100%;aspect-ratio:16/9;object-fit:cover;background:var(--rule);display:block}
.sieve h2{font-size:16px;font-weight:600;line-height:1.5;margin:12px 0 4px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:14px 0 4px}
.row>span:first-child{font-size:12.5px;color:var(--muted);width:4.2em;flex:none}
.seg{display:flex;flex:1;border:1px solid var(--rule);background:#fff}
.seg button{flex:1;padding:8px 0;font-size:13px;color:var(--muted);border-right:1px solid var(--rule)}
.seg button:last-child{border-right:none}
.seg button[aria-pressed=true]{background:var(--pine);color:#fff;font-weight:600}
.verdict{display:flex;gap:6px;margin-top:16px}
.verdict button{flex:1;padding:12px 2px;font-size:13.5px;font-weight:600;border:1px solid}
.take{background:var(--pine);color:#fff;border-color:var(--pine)}
.take[disabled]{opacity:.35}
.skip{color:var(--clay);border-color:var(--rule)}
.seen{color:var(--muted);border-color:var(--rule)}
.foot{display:flex;align-items:center;gap:10px;margin-top:12px}
.foot .undo{font-size:12px;color:var(--pine);border-bottom:1px solid currentColor;padding-bottom:1px}
.foot .undo[disabled]{color:var(--rule);border-color:transparent}
.foot .meta{margin-left:auto;text-align:right}
.cap{display:flex;align-items:center;gap:9px;margin:0 0 14px;cursor:pointer}
.capbar{flex:1;height:5px;background:var(--rule);overflow:hidden}
.capbar i{display:block;height:100%;background:var(--pine)}
.cap .num{font-size:11.5px;color:var(--muted);flex:none}
.soon{color:var(--clay)}
.diag td{padding:5px 4px}
.rbar{height:5px;background:var(--rule)}
.rbar i{display:block;height:100%;background:var(--pine)}
.live{margin-left:auto;font-family:var(--num);font-size:22px;color:var(--pine)}

/* ── ランキング ─────────────────── */
.filter{display:flex;gap:6px;margin-bottom:14px}
.filter button{
  padding:6px 12px;font-size:13px;border:1px solid var(--rule);color:var(--muted);background:#fff;
}
.filter button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.item{display:flex;gap:11px;padding:12px 0;border-bottom:1px solid var(--rule);align-items:flex-start}
.rank{font-family:var(--num);font-size:13px;color:var(--muted);width:2.2em;flex:none;padding-top:2px}
.item.explore .rank{color:var(--sand)}
.body{flex:1;min-width:0}
.body a{display:block;font-size:14.5px;font-weight:600;line-height:1.45;text-decoration:none;color:var(--ink)}
.acts{display:flex;gap:14px;margin-top:7px}
.acts button{font-size:12.5px;color:var(--pine);border-bottom:1px solid currentColor;padding-bottom:1px}
.acts .off{color:var(--clay)}
.sc{font-family:var(--num);font-size:17px;width:2.6em;text-align:right;flex:none;color:var(--pine)}

/* ── チャンネル ─────────────────── */
.add{display:flex;gap:8px;margin-bottom:10px;padding:4px;border:1px dashed transparent}
.add.over{border-color:var(--pine);background:var(--surface)}
.add input{flex:1;min-width:0;padding:9px;border:1px solid var(--rule);font:inherit;font-size:13px;background:#fff}
.add button{padding:9px 16px;border:1px solid var(--pine);background:var(--pine);color:#fff;font-weight:600}
.chrow{padding:14px 0;border-bottom:1px solid var(--rule)}
.chhead{display:flex;align-items:baseline;gap:10px}
.chhead b{font-size:15px;font-weight:600}
.chhead .rename{font-size:15px;font-weight:600;text-align:left;
  border-bottom:1px dashed var(--rule);padding-bottom:1px}
.chrow .del{margin-left:auto;font-size:12px;color:var(--clay)}
.chrow .meta .num{font-size:10.5px}
.chrow .row{margin:10px 0 0}
.chrow .row>span:first-child{width:5.6em}
.chrow .seg button{padding:6px 0;font-size:12px}
.addch{font-size:12.5px;color:var(--pine);border-bottom:1px solid currentColor;
  padding-bottom:1px;text-align:left}

/* ── 記録 ───────────────────────── */
.stat{display:flex;align-items:baseline;gap:10px;padding:11px 0;border-bottom:1px solid var(--rule)}
.stat span:first-child{font-size:13.5px}
.stat .v{margin-left:auto;font-family:var(--num);font-size:19px}
.stat small{display:block;font-size:11.5px;color:var(--muted);line-height:1.5;margin-top:2px}
table{width:100%;border-collapse:collapse;margin-top:8px;font-size:13px}
th,td{text-align:left;padding:6px 4px;border-bottom:1px solid var(--rule)}
th{font-size:11.5px;color:var(--muted);font-weight:400}
td.n{font-family:var(--num);text-align:right}

/* ── 保存バー ───────────────────── */
#bar{
  position:fixed;left:0;right:0;bottom:0;background:var(--surface);
  border-top:1px solid var(--rule);padding:10px 14px calc(10px + env(safe-area-inset-bottom));
  display:flex;align-items:center;gap:12px;font-size:12.5px;
}
#bar .inner{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:12px;width:100%}
#bar button{padding:7px 14px;border:1px solid var(--pine);color:var(--pine);font-weight:600}
#bar button.on{background:var(--pine);color:#fff}
#msg{color:var(--muted);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
dialog{border:1px solid var(--rule);background:var(--surface);padding:20px;max-width:420px;width:90%}
dialog::backdrop{background:rgba(22,24,26,.4)}
dialog h3{font-size:15px;margin-bottom:10px;line-height:1.5}
#rate p{font-size:13px;color:var(--ink);margin-bottom:12px}
#rate p.foot{font-size:11.5px;color:var(--muted);margin:10px 0 0;text-align:center}
.scale{display:flex;gap:6px}
.scale button{flex:1;padding:14px 0;border:1px solid var(--rule);background:#fff;
  font-size:17px;font-family:var(--num)}
.scale button:active{background:var(--pine);color:#fff}
.reasons{display:flex;flex-direction:column;gap:7px}
.reasons button{text-align:left;border:1px solid var(--rule);background:#fff;padding:10px 12px}
.reasons b{display:block;font-size:13.5px;font-weight:600;margin-bottom:2px}
.reasons small{color:var(--muted);font-size:11.5px;line-height:1.5}
#rate .cancel{display:block;width:100%;margin-top:14px;padding:9px;
  border:1px solid var(--rule);font-size:13px;color:var(--muted)}
dialog p{font-size:12.5px;color:var(--muted);margin-bottom:12px}
dialog input{width:100%;padding:8px;border:1px solid var(--rule);font:inherit;font-size:13px;margin-bottom:8px;background:#fff}
@media (prefers-reduced-motion:no-preference){.sieve{animation:in .18s ease-out}}
@keyframes in{from{opacity:0;transform:translateY(4px)}}
nav{overflow-x:auto;scrollbar-width:none}nav button{white-space:nowrap;flex:none}
.h3{margin:20px 0 6px;font-size:14px}
.gate{border:1px solid var(--rule);background:var(--surface);padding:12px;margin-bottom:12px;display:flex;flex-direction:column;gap:5px}
.gate b{font-size:16px}.gate.op b{color:var(--pine)}.gate.cl b{color:var(--clay)}.gate span{font-size:12.5px;color:var(--muted)}
.extb{border:1px solid var(--sand);background:#f8f3e6;padding:10px;margin-bottom:12px;font-size:13px}
.qrow{margin:12px 0 2px}.qh{display:flex;align-items:baseline;gap:8px;font-size:13px}.qh b{margin-left:auto;font-size:15px;color:var(--pine)}
.qh .auto{font-size:10.5px;color:var(--sand);border:1px solid var(--sand);padding:0 4px}
.qrow input[type=range]{width:100%;accent-color:var(--pine);margin:4px 0 0}.qrow input.untouched{opacity:.45}
.qends{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.tags button{border:1px solid var(--rule);padding:4px 10px;font-size:12.5px;background:#fff}
.tags button[aria-pressed=true]{background:var(--pine);color:#fff;border-color:var(--pine)}
.linkb{font-size:12px;color:var(--muted);border-bottom:1px dotted currentColor}
.chart{width:100%;height:auto;background:var(--surface);border:1px solid var(--rule);margin:4px 0}
.kf{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--rule)}.kf label{flex:1;font-size:13px}
.kf small{display:block;font-size:11px;color:var(--muted)}.kf input{width:7.5em;padding:6px;border:1px solid var(--rule);font:inherit;font-size:13px;background:#fff}
.kf input[data-kt]{width:12em}
#pl{position:fixed;inset:0;z-index:50;background:#000;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
#pl[hidden]{display:none}
.plh{display:flex;gap:10px;align-items:center;color:#fff;padding:10px 12px;font-size:13px}.plh b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plh{flex:none}.plt{flex:1;min-width:0;display:flex;flex-direction:column}.plt b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.plt .num{color:#bbb;font-size:11.5px}
.plx.stop{color:#fff;background:var(--clay);border-color:var(--clay)}
.plv{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
#ytp,#pl iframe{border:0;aspect-ratio:16/9;width:min(100vw,calc((100dvh - 140px) * 16 / 9));height:auto;max-height:calc(100dvh - 140px);flex:none}
.pla{display:flex;gap:6px;padding:8px 10px;flex:none}.pla button{flex:1;padding:11px 4px;font-weight:600;border:1px solid;font-size:12.5px}
.pla .seen{color:#ddd;border-color:#555}
.plf{position:fixed;top:calc(env(safe-area-inset-top) + 64px);right:10px;z-index:60;background:rgba(0,0,0,.65);color:#fff;border:1px solid #888;padding:6px 10px;font-size:12px;border-radius:4px}
.reasons button[aria-pressed=true]{border-color:var(--pine);background:#eef3f0}
.se-row{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;margin:.5rem 0;font-size:13px}.se-btn{min-width:2.6rem;border:1px solid var(--rule);border-radius:999px;background:#fff;padding:.1rem .7rem;cursor:pointer}.se-btn[aria-pressed="true"]{background:var(--pine);color:#fff}.se-vol{display:flex;align-items:center;gap:.3rem}.se-vol input{width:8rem}
.vgrid{display:grid;gap:2px;margin:8px 0 2px;align-items:end}
.vcol{display:flex;flex-direction:column;align-items:center;gap:1px;min-width:0}
.vcol .vl{font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.vcol b{font-size:13px;color:var(--pine)}
.vcol input[type=range]{writing-mode:vertical-lr;direction:rtl;width:30px;height:120px;margin:2px 0;accent-color:var(--pine);touch-action:none}
.vcol input.untouched{opacity:.4}
.vcol .auto{font-size:9px;color:var(--sand);border:1px solid var(--sand);padding:0 2px;line-height:1.3}.vcol .auto0{height:13px}
.vhelp{font-size:11.5px;color:var(--muted);min-height:1.6em;margin:2px 0 6px}
.thead{display:flex;gap:10px;align-items:flex-start}
.thead img{width:46%;max-width:240px;flex:none;aspect-ratio:16/9;height:auto;object-fit:contain;background:#000;max-height:none}
.thead .tt{flex:1;min-width:0}.thead h2{margin:0 0 4px;font-size:14px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.sieve h2{font-size:15px;margin:8px 0 2px}
#rate{max-height:92vh;overflow:auto}
#pl{height:100dvh;overflow:hidden}.plx{color:#fff;border:1px solid #777;padding:6px 10px;font-size:13px;flex:none}
.pla{background:#000}
#judge-btn.willdrop{background:var(--clay);border-color:var(--clay)}
.dt{display:block;font-size:14px;font-weight:600;line-height:1.45}
details.dropped{margin-top:18px;border-top:1px solid var(--rule);padding-top:8px}details.dropped summary{cursor:pointer;font-size:13.5px;color:var(--muted);padding:6px 0}
.item.serial .rank{color:var(--sand)}
.verify{border:1px solid var(--rule);background:var(--surface);padding:10px;margin:8px 0}.verify b{display:block;font-size:13.5px;margin-bottom:2px}.verify table{margin-top:6px}
.cseg{display:flex;margin:0 0 12px;flex-wrap:nowrap;overflow-x:auto}.cseg button{flex:1;white-space:nowrap}
.rules{border:1px solid var(--rule);border-left:4px solid var(--pine);background:var(--surface);padding:9px 11px;margin:0 0 12px;font-size:12.5px;line-height:1.7}
#pl.withc .plv{flex:none}#pl.withc #ytp,#pl.withc iframe{width:min(100vw,calc(32dvh * 16 / 9));max-height:32dvh}
.plc{flex:1;min-height:0;overflow:auto;background:#141414;color:#e6e6e6;padding:4px 12px 10px;font-size:13px;line-height:1.55;-webkit-overflow-scrolling:touch}
.plc[hidden]{display:none}.cm{padding:8px 0;border-bottom:1px solid #2a2a2a}.cm.rp{margin-left:18px;font-size:12.5px}.cm b{font-size:12px;color:#fff}.cm-m{font-size:11px;color:#999}
.cm-h{display:flex;gap:6px;position:sticky;top:0;background:#141414;padding:6px 0}.cm-h button{flex:1;border:1px solid #444;color:#ccc;padding:5px;font-size:12px}.cm-h button[aria-pressed=true]{background:#e6e6e6;color:#111}
.cm-t{color:#7db8ff;text-decoration:underline;padding:0}.cm-more{display:block;width:100%;margin:8px 0;padding:8px;border:1px solid #444;color:#ccc;font-size:12px}.cm-more.rp{margin-left:18px;width:calc(100% - 18px)}
.cm-note{color:#bbb;padding:12px 0}
.add select{padding:0 6px;border:1px solid var(--rule);background:#fff;font:inherit;font-size:13px}
.slrow td{background:#f6ebe6}

</style>
</head>
<body>

<header>
  <h1>関 所</h1>
  <span id="stamp"></span>
</header>

<div id="warn"></div>
<nav id="tabs"></nav>
<main id="view"></main>

<div id="bar"><div class="inner">
  <span id="msg">読み込み中</span>
  <button id="cfg">接続</button>
  <button id="save" class="on">保存</button>
</div></div>

<div id="pl" hidden></div>

<dialog id="rate">
  <div id="rateBody"></div>
  <button class="cancel" onclick="document.getElementById('rate').close();rateClosed()">閉じる(中断として残す)</button>
</dialog>

<dialog id="dlg">
  <h3>GitHubに保存する</h3>
  <p>評価の書き戻しにはトークンが要る。Fine-grained PAT を対象リポジトリだけに絞って Contents: Read and write で発行して、ここに入れる。ブラウザのlocalStorageにだけ残る。</p>
  <input id="repo" placeholder="owner/repo" autocapitalize="off" spellcheck="false">
  <input id="tok" type="password" placeholder="github_pat_..." autocapitalize="off" spellcheck="false">
  <p style="margin:10px 0 8px">任意。YouTubeのAPIキーを入れると、@ハンドルやURLを貼るだけでチャンネルを追加できる。無くてもUC…形式のIDなら追加できる。</p>
  <input id="ytk" type="password" placeholder="AIza... (任意)" autocapitalize="off" spellcheck="false">
  <div style="display:flex;gap:8px;margin-top:6px">
    <button onclick="saveCfg()" style="flex:1;padding:9px;border:1px solid var(--pine);background:var(--pine);color:#fff;font-weight:600">つなぐ</button>
    <button onclick="dlg.close()" style="padding:9px 14px;border:1px solid var(--rule)">閉じる</button>
  </div>
</dialog>

<script id="se-core">

// ───────── 効果音(ブラウザの中で音を合成。音のファイルは使わない)─────────
// 設定(入/切・音量)は 3つのアプリで共通(localStorage の se-on / se-vol)
const SE = (() => {
  let ctx = null, master = null, lastTap = 0, lastErr = 0;
  const ls = (k, d) => { try { const v = localStorage.getItem(k); return v == null ? d : v; } catch (e) { return d; } };
  let on = ls("se-on", "1") !== "0", vol = Math.max(0, Math.min(1, +ls("se-vol", "0.5")));
  function ac(){
    if (!on) return null;
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null;
    if (!ctx) { ctx = new AC(); master = ctx.createGain(); master.connect(ctx.destination); }
    if (ctx.state === "suspended") ctx.resume();
    master.gain.value = vol * 0.9;
    return ctx;
  }
  // 1つの音:周波数 f(滑らせるなら f2)、始まり t、長さ d、波の形、大きさ g
  function note(c, f, t, d, o){
    o = o || {};
    const osc = c.createOscillator(), gn = c.createGain(), t0 = c.currentTime + (t || 0);
    osc.type = o.type || "sine"; osc.frequency.setValueAtTime(f, t0);
    if (o.f2) osc.frequency.exponentialRampToValueAtTime(o.f2, t0 + d);
    const g = o.g == null ? 0.2 : o.g, a = o.a == null ? 0.005 : o.a;
    gn.gain.setValueAtTime(0.0001, t0); gn.gain.exponentialRampToValueAtTime(g, t0 + a);
    gn.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
    let last = gn;
    if (o.lp) { const fl = c.createBiquadFilter(); fl.type = "lowpass"; fl.frequency.value = o.lp; gn.connect(fl); last = fl; }
    osc.connect(gn); last.connect(master); osc.start(t0); osc.stop(t0 + d + 0.05);
  }
  // 鐘のような音(基音 + 倍音)
  const bell = (c, f, t, d, g) => { note(c, f, t, d, { g: g }); note(c, f * 2, t, d * 0.6, { g: g * 0.35 }); note(c, f * 3.01, t, d * 0.3, { g: g * 0.12 }); };
  // ざわめき(風・波)
  function noise(c, t, d, o){
    o = o || {};
    const n = Math.floor(c.sampleRate * d), buf = c.createBuffer(1, n, c.sampleRate), ch = buf.getChannelData(0);
    for (let i = 0; i < n; i++) ch[i] = Math.random() * 2 - 1;
    const src = c.createBufferSource(), fl = c.createBiquadFilter(), gn = c.createGain(), t0 = c.currentTime + (t || 0);
    src.buffer = buf; fl.type = o.type || "lowpass"; fl.Q.value = o.q || 0.7;
    fl.frequency.setValueAtTime(o.f || 400, t0); if (o.f2) fl.frequency.exponentialRampToValueAtTime(o.f2, t0 + d * 0.8);
    const g = o.g || 0.08;
    gn.gain.setValueAtTime(0.0001, t0); gn.gain.exponentialRampToValueAtTime(g, t0 + d * 0.35); gn.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
    src.connect(fl); fl.connect(gn); gn.connect(master); src.start(t0); src.stop(t0 + d + 0.05);
  }
  const lib = {
    tap: c => note(c, 880, 0, 0.05, { f2: 660, g: 0.05 }),
    tab: c => { note(c, 520, 0, 0.07, { type: "triangle", g: 0.07 }); note(c, 780, 0.03, 0.06, { type: "triangle", g: 0.04 }); },
    toggleOn: c => note(c, 600, 0, 0.08, { f2: 1150, g: 0.08 }),
    toggleOff: c => note(c, 900, 0, 0.08, { f2: 480, g: 0.06 }),
    done: c => { bell(c, 1046.5, 0, 0.45, 0.11); bell(c, 1318.5, 0.08, 0.6, 0.11); },
    save: c => { bell(c, 784, 0, 0.35, 0.08); bell(c, 1174.7, 0.01, 0.4, 0.06); },
    remove: c => note(c, 520, 0, 0.14, { f2: 240, type: "triangle", g: 0.08 }),
    error: c => { note(c, 220, 0, 0.09, { type: "square", g: 0.05, lp: 900 }); note(c, 196, 0.12, 0.12, { type: "square", g: 0.05, lp: 900 }); },
    open: c => noise(c, 0, 0.18, { f: 300, f2: 2400, type: "bandpass", q: 1.2, g: 0.05 }),
    fanfare: c => { [523.25, 659.25, 783.99].forEach((f, i) => { note(c, f, i * 0.09, 0.3, { type: "triangle", g: 0.12 }); note(c, f * 2, i * 0.09, 0.2, { g: 0.03 }); });
      bell(c, 1046.5, 0.27, 1.1, 0.13); note(c, 523.25, 0.27, 1.0, { type: "triangle", g: 0.06 });
      [2093, 2637, 3136, 2637].forEach((f, i) => note(c, f, 0.45 + i * 0.07, 0.25, { g: 0.025 })); },
    levelup: c => { note(c, 600, 0, 0.5, { f2: 1600, type: "triangle", g: 0.08 }); [1568, 1975.5, 2349.3, 3136].forEach((f, i) => bell(c, f, 0.35 + i * 0.06, 0.4, 0.04)); },
    issue: c => { [392, 523.25, 659.25, 783.99].forEach((f, i) => note(c, f, i * 0.12, i === 3 ? 0.9 : 0.22, { type: "sawtooth", g: 0.07, lp: 1800, a: 0.02 }));
      note(c, 196, 0.36, 0.9, { type: "sawtooth", g: 0.04, lp: 700, a: 0.03 }); },
    swell: c => { noise(c, 0, 0.9, { f: 200, f2: 1400, g: 0.05 }); [440, 554.4, 659.3].forEach(f => note(c, f, 0.05, 0.9, { g: 0.035, a: 0.35 })); },
    unswell: c => { noise(c, 0, 0.6, { f: 1200, f2: 250, g: 0.04 }); note(c, 554.4, 0, 0.5, { f2: 440, g: 0.04, a: 0.1 }); },
    pluck: c => { note(c, 880, 0, 0.35, { type: "triangle", g: 0.09, a: 0.002 }); note(c, 1318.5, 0.05, 0.4, { type: "triangle", g: 0.06, a: 0.002 }); },
    link: c => { note(c, 659.3, 0, 0.25, { type: "triangle", g: 0.08, a: 0.002 }); note(c, 987.8, 0.09, 0.35, { type: "triangle", g: 0.08, a: 0.002 }); },
    lock: c => { note(c, 180, 0, 0.06, { type: "square", g: 0.05, lp: 1200 }); note(c, 120, 0.05, 0.08, { type: "square", g: 0.05, lp: 900 }); },
    unlock: c => { note(c, 160, 0, 0.05, { type: "square", g: 0.05, lp: 1200 }); bell(c, 1318.5, 0.08, 0.45, 0.07); },
    send: c => noise(c, 0, 0.25, { f: 2400, f2: 400, type: "bandpass", q: 1.5, g: 0.06 }),
    down: c => { note(c, 660, 0, 0.25, { f2: 440, type: "triangle", g: 0.07 }); },
  };
  function play(name, opt){
    try {
      const c = ac(); if (!c || !lib[name]) return;
      if (name === "tap" || name === "tab") { const now = Date.now(); if (now - lastTap < 45) return; lastTap = now; }
      if (name === "error") { const now = Date.now(); if (now - lastErr < 500) return; lastErr = now; }
      lib[name](c, opt);
    } catch (e) {}
  }
  // 場面の見分け:アプリごとの [選び方, 音] の並び(上から順に見る)
  let rules = [];
  function soundFor(el){
    for (const [sel, snd] of rules) { const hit = el.closest(sel); if (hit) return typeof snd === "function" ? snd(hit) : snd; }
    const inp = el.closest("input");
    if (inp && (inp.type === "checkbox" || inp.type === "radio")) return inp.checked ? "toggleOn" : "toggleOff";
    if (el.closest("nav button, [role=tab], .tabs button")) return "tab";
    if (el.closest("button, a[href], summary, .chip-b, [data-v]")) return "tap";
    return null;
  }
  function init(appRules){
    rules = appRules || [];
    document.addEventListener("click", e => { const s = e.target && e.target.closest ? soundFor(e.target) : null; if (s) play(s); }, true);
    // エラーの表示(class="err")が出たら、低い音
    try {
      new MutationObserver(ms => { for (const m of ms) { const el = m.target.nodeType === 1 ? m.target : m.target.parentElement; if (!el || !el.closest) continue;
        const er = el.closest(".err"); if (er && (er.textContent || "").trim()) { play("error"); break; } } })
        .observe(document.body, { subtree: true, childList: true, characterData: true, attributes: true, attributeFilter: ["class"] });
    } catch (e) {}
  }
  // 設定の欄(入/切・音量)。アプリの版の表示のそばに置く
  function mount(anchor){
    if (!anchor || document.getElementById("se-row")) return;
    const row = document.createElement("div"); row.id = "se-row"; row.className = "se-row";
    row.innerHTML = '<span>効果音</span><button type="button" id="se-on" class="se-btn"></button><label class="se-vol">音量 <input id="se-vol" type="range" min="0" max="1" step="0.05"></label>';
    anchor.parentNode.insertBefore(row, anchor.nextSibling);
    const b = row.querySelector("#se-on"), r = row.querySelector("#se-vol");
    const show = () => { b.textContent = on ? "入" : "切"; b.setAttribute("aria-pressed", String(on)); r.value = vol; r.disabled = !on; };
    b.addEventListener("click", () => { on = !on; try { localStorage.setItem("se-on", on ? "1" : "0"); } catch (e) {} show(); if (on) play("toggleOn"); });
    r.addEventListener("input", () => { vol = +r.value; try { localStorage.setItem("se-vol", String(vol)); } catch (e) {} });
    r.addEventListener("change", () => play("done"));
    show();
  }
  return { play, init, mount, soundFor, get on(){ return on; } };
})();

</script>
<script>
const $ = s => document.querySelector(s);
const PATH = "docs/data/stock.json";
const CHPATH = "docs/data/channels.json";
const WPATH  = "docs/data/watched.json";
const SPATH  = "docs/data/stats.json";
const LS = "yt-sieve";

const TYPES = {focus:"しっかり", ambient:"ながら", serial:"連載"};
let cfg = {weights:{expect:1,pull:.6,trust:.8,fresh:.5,views:.4}, defaults:{halfLifeDays:30}, channels:[]};
let stock = {videos:{}, updated:null};
let sha = null, chSha = null;
let tab = "gate", filter = "focus", dirty = false, chDirty = false;
let draft = {};   // ふるい台の入力中の値
let undo = null;  // 直前の裁きを1回だけ巻き戻すための控え
let cfgOK = true; // channels.json を読めたか(読めないと枠が効かない)
let watched = {videos:{}};  // 視聴済み。収集側が毎晩 stock から移してくる
let stats = {};             // 月×チャンネルの集計

/* ══ スコア ══════════════════════════════════ */
const ch = id => cfg.channels.find(c => c.id === id) || {};

/* 同じチャンネルでも系列で満足度が違う(配信アーカイブと切り抜き、企画と雑談)。
   タイトル頭の 【】 や 「」 を系列の名札として使う。 */
function seriesOf(v){
  const t = v.title || "";
  const m = t.match(/^\s*[【\[]([^】\]]{1,24})[】\]]/) || t.match(/^\s*「([^」]{1,24})」/);
  return (v.channelId || "") + "/" + (m ? m[1].trim() : "");
}

let trustCache = null;
function buildTrust(){
  if (!trustCache){
    // 1回の描画で全チャンネルぶんをまとめて作る(毎回全在庫を走査しないため)
    const ch = {}, se = {};
    // 退避済み(watched.json)と、まだ stock に残っている当日分の両方を見る
    for (const v of [...Object.values(watched.videos||{}), ...Object.values(stock.videos)]){
      if (!v.post?.score) continue;
      (ch[v.channelId] ||= []).push(v.post.score);
      (se[seriesOf(v)] ||= []).push(v.post.score);
    }
    const mean = a => a.reduce((x,y)=>x+y,0) / a.length;
    trustCache = {ch:{}, se:{}, n:{}};
    for (const k in ch) trustCache.ch[k] = (mean(ch[k])*ch[k].length + 3*3) / (ch[k].length + 3) / 5;
    for (const k in se){
      // 系列は本数が少ないので、チャンネルの値に向かって縮める
      const base = trustCache.ch[k.split("/")[0]] ?? 0.6;
      trustCache.se[k] = (mean(se[k])/5*se[k].length + base*3) / (se[k].length + 3);
      trustCache.n[k] = se[k].length;
    }
  }
  return null;
}

function trustOf(v){
  if (!trustCache) buildTrust();
  const key = typeof v === "string" ? null : seriesOf(v);
  const cid = typeof v === "string" ? v : v.channelId;
  if (key && trustCache.se[key] != null) return trustCache.se[key];
  return trustCache.ch[cid] ?? 0.6;   // 実績なしは prior のまま
}

function freshOf(v){
  const hl = learnedHL(v.channelId);             // すべて記録から計算する(自分では決めない)
  if (hl == null || hl >= 365) return 1;          // 旬ではない(時間では減らさない)
  const t = Date.parse(v.published || v.added || v.watchedAt || "");
  if (isNaN(t)) return 1;
  return Math.pow(2, -Math.max(0, (Date.now() - t) / 864e5) / hl);
}
// 記録から学ぶ旬:出てから見るまでの日数と、見たあとの評価(予想とのずれ)を比べ、
// 遅れるほどはっきり下がるチャンネルだけ、その下がり方から半減期を出す(6本以上・日数の幅が7日以上)
let hlCache = null;
function learnedHL(cid){
  if (!hlCache){
    hlCache = {};
    const by = {};
    for (const v of [...Object.values(watched.videos||{}), ...Object.values(stock.videos)]){
      if (!v.post || v.post.score == null || !v.published || !v.watchedAt) continue;
      const days = (Date.parse(v.watchedAt) - Date.parse(v.published)) / 864e5; if (!(days >= 0)) continue;
      (by[v.channelId] ||= []).push({ days, gap: v.post.score - (v.pre && v.pre.expect != null ? v.pre.expect : 3), score: v.post.score });
    }
    for (const [k, a] of Object.entries(by)){
      const n = a.length; if (n < 6) continue;
      const xs = a.map(x => x.days), ys = a.map(x => x.gap); if (Math.max(...xs) - Math.min(...xs) < 7) continue;
      const mx = xs.reduce((p,q)=>p+q,0)/n, my = ys.reduce((p,q)=>p+q,0)/n;
      const sxy = xs.reduce((p,x,i)=>p+(x-mx)*(ys[i]-my),0), sxx = xs.reduce((p,x)=>p+(x-mx)**2,0), syy = ys.reduce((p,y)=>p+(y-my)**2,0);
      if (!sxx || !syy) continue;
      const slope = sxy / sxx, r = sxy / Math.sqrt(sxx * syy), t = r * Math.sqrt((n - 2) / Math.max(1e-9, 1 - r * r));
      if (slope < 0 && t <= -2){ const base = a.reduce((p,x)=>p+x.score,0)/n; hlCache[k] = { hl: Math.max(3, Math.min(364, Math.round(base / (2 * -slope)))), n, slope }; }
      else hlCache[k] = { hl: null, n };
    }
  }
  return hlCache[cid] && hlCache[cid].hl != null ? hlCache[cid].hl : null;
}

/* そのチャンネルの再生数の中央値。サムネ判断とは独立した「他人がもう見た結果」。 */
let medCache = null;
function medianViews(cid){
  if (!medCache){
    const by = {};
    for (const v of [...Object.values(watched.videos||{}), ...Object.values(stock.videos)])
      if (v.views) (by[v.channelId] ||= []).push(v.views);
    medCache = {};
    for (const k in by){ const a = by[k].sort((x,y)=>x-y); medCache[k] = a[a.length>>1]; }
  }
  return medCache[cid] || 0;
}

function viewsOf(v){
  const med = medianViews(v.channelId);
  if (!med || !v.views) return 0.5;          // 判断材料なし = 中立
  const r = v.views / med;
  return Math.min(0.95, Math.max(0.1, r / (1 + r) * 2 * 0.5 + 0.25));
}

function scoreOf(v, pre){
  pre = pre || v.pre || {};
  const p = {
    expect: (pre.expect ?? 3) / 5,
    pull:   (pre.pull   ?? 3) / 5,
    trust:  trustOf(v),
    fresh:  freshOf(v),
    views:  viewsOf(v),
  };
  // 重み付き幾何平均 = exp( Σwᵢ·ln pᵢ / Σwᵢ )
  let s = 0, W = 0;
  for (const k in cfg.weights){
    s += cfg.weights[k] * Math.log(Math.max(p[k], .02));
    W += cfg.weights[k];
  }
  return Math.exp(s / W) * 100;
}

/* ══ 整形 ════════════════════════════════════ */
const hhmm = s => s == null ? "—"
  : (s >= 3600 ? Math.floor(s/3600)+":"+String(Math.floor(s%3600/60)).padStart(2,"0")
               : Math.floor(s/60)) + ":" + String(s%60).padStart(2,"0");
const ago = iso => { const d = Math.floor((Date.now()-Date.parse(iso))/864e5);
  return d <= 0 ? "今日" : d + "日前"; };
const esc = s => (s||"").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const list = st => Object.values(stock.videos).filter(v => v.state === st);

/* ══ 描画 ════════════════════════════════════ */
function render(){
  trustCache = null; medCache = null; hlCache = null;
  try { draw(); }
  catch(e){
    console.error(e);
    $("#view").innerHTML = `<div class="empty"><b>描画でエラー</b>${esc(e.message)}<br>
      <span class="num" style="font-size:11px">${esc((e.stack||"").split("\n")[1]||"")}</span></div>`;

}

function draw(){
  $("#warn").innerHTML = cfgOK ? "" :
    `チャンネル設定を読めていない。時間枠も既定の型も効いていない状態。
     読み込みが終わるまで裁かないほうがいい。`;
  const n = {sieve:list("pool").length, rank:list("picked").filter(v => !(v.serial || v.type === "serial")).length};
  $("#tabs").innerHTML = [
    ["gate","門",""],["sieve","改め",n.sieve],["rank","宿場",n.rank],["serial","連載",list("picked").filter(v => v.serial || v.type === "serial").length],["play","遊戯",""],
    ["chart","相場表",""],["log","記録",""],["chan","チャンネル",cfg.channels.length],["kset","設定",""]
  ].map(([k,label,c]) =>
    `<button aria-selected="${tab===k}" onclick="go('${k}')">${label}${
      c ? `<span class="badge">${c}</span>` : ""}</button>`).join("");

  $("#stamp").textContent = (stock.updated ? "収集 " + stock.updated.slice(5,10) + " ・ " : "") + KVER.split(" ")[1];
  ({gate:drawGate, sieve:drawSieve, rank:drawRank, serial:drawSerialTab, play:drawPlay, chart:drawChart, log:drawLog, chan:drawChans, kset:drawKset}[tab] || drawGate)();
}
function go(k){ tab = k; render(); window.scrollTo(0,0); }

/* ── ふるい台:1本ずつ裁く ─────────────── */
function badges(v){
  const b = [];
  if (v.manual) b.push(["自分で追加", "pill"]);
  if (v.daily)  b.push(["今日の1本", "pill day"]);
  if (v.rerun)  b.push(["再放送", "pill run"]);
  if (v.expiredCount) b.push(["差し戻し", "pill back"]);
  if (v.bailReason === "later") b.push(["今じゃなかった", "pill back"]);
  if (v.bailReason === "long") b.push(["長すぎた", "pill back"]);
  return b.map(([t,c]) => `<span class="${c}">${t}</span>`).join(" ") + (b.length ? " ・ " : "");
}

function gauge(type){
  if (!type) return "";
  const cap = capOf(type);
  if (!cap) return `${TYPES[type]}: 無制限`;
  const used = pickedOf(type).reduce((a,x) => a + (x.duration||0), 0);
  return `${TYPES[type]}枠 ${(used/3600).toFixed(1)}/${(cap/3600).toFixed(0)}時間`;
}
function addChanOf(id){
  const c = stock.videos[id]?.newChan;
  if (!c) return;
  if (!cfg.channels.some(x => x.id === c.id))
    cfg.channels.push({id:c.id, name:c.name || c.id, defaultType:"focus"});
  for (const v of Object.values(stock.videos)) if (v.newChan?.id === c.id) delete v.newChan;
  chTouch(); touch(); render();
}

function snap(...vids){
  undo = {snaps: vids.map(v => [v.id, JSON.stringify(v)]), draft: null};
}

function rewind(){
  if (!undo) return;
  for (const [id, json] of undo.snaps) stock.videos[id] = JSON.parse(json);
  if (undo.draft) draft[undo.draft[0]] = undo.draft[1];
  undo = null; touch(); render();
}

function expireIn(v){
  const c = ch(v.channelId);
  const ed = c.expireDays ?? cfg.defaults.expireDays ?? 14;
  return Math.max(0, Math.ceil(ed - (Date.now() - Date.parse(v.pickedAt||v.added))/864e5));
}

function setCap(){
  const now = (capOf(filter)/3600).toFixed(0);
  const h = prompt(`${TYPES[filter]}の枠を何時間にする?\n\n` +
    `今の設定: ${now}時間。\n枠を広げるほど溜まりやすくなる。`, now);
  const n = parseFloat(h);
  if (isNaN(n) || n < 0) return;
  (cfg.defaults.capacityHours ||= {})[filter] = n;
  chTouch(); render();
}

/* ── チャンネル ────────────────────────── */
function drawChans(){
  const rows = cfg.channels.map((c,i) => {
    const stocked = Object.values(stock.videos).filter(v => v.channelId === c.id).length;
    const seg = Object.entries(TYPES).map(([k,l]) =>
      `<button aria-pressed="${c.defaultType===k}" onclick="setCh(${i},'defaultType','${k}')">${l}</button>`).join("");
    return `<div class="chrow">

      <div class="row"><span>鮮度</span><span class="meta" style="margin-left:auto">${learnedHL(c.id)!=null ? `旬もの(半減期 ${learnedHL(c.id)}日)` : "旬ではない(時間では減らさない)"}</span></div>
      <p class="meta" style="margin-top:2px">記録から自動で計算。${(hlCache[c.id]||{}).n ? `見た${hlCache[c.id].n}本から判断` : "まだ記録が足りない(6本以上・日数の幅7日以上で判断)"}</p>
    </div>`;
  }).join("");

  $("#view").innerHTML = `
    <div class="add">
      <input id="q" placeholder="チャンネルURL / @ハンドル / 動画URL" autocapitalize="off" spellcheck="false">
      <button onclick="addCh()">追加</button>
    </div>
    <p class="meta" id="addmsg" style="margin:-4px 0 16px">

      <b>subscriptions.csv</b> をこの枠にドロップ。</p>
    ${rows || `<div class="empty"><b>チャンネルが空</b>
      上の欄にチャンネルのURLを貼って追加する。<br>
      10個くらいから始めて、裁くのが作業に感じたら減らす。</div>`}
    ${cfg.channels.length ? `<p class="meta" style="margin-top:18px">
      追加したチャンネルは、次の朝の収集から在庫に入る。
      すぐ試すならActionsタブから collect を手動実行。</p>` : ""}`;

  const box = $(".add");
  box.ondragover = e => { e.preventDefault(); box.classList.add("over"); };
  box.ondragleave = () => box.classList.remove("over");
  box.ondrop = async e => {
    e.preventDefault(); box.classList.remove("over");

  };
}

function setCh(i, key, val){ cfg.channels[i][key] = val; chTouch(); render(); }
function renameCh(i){
  const c = cfg.channels[i];
  const n = prompt("チャンネル名", c.name === c.id ? "" : c.name);
  if (n === null) return;
  c.name = n.trim() || c.id;
  chTouch(); render();
}
function delCh(i){
  const c = cfg.channels[i], nm = c.name || c.id;
  if (!confirm(`${nm} を外す?\n次の朝から、このチャンネルの新しい動画は集まらなくなる。`)) return;
  const mine = Object.values(stock.videos).filter(v => v.channelId === c.id), wait = mine.filter(v => v.state === "pool" || v.state === "fresh"), lodge = mine.filter(v => v.state === "picked");
  cfg.channels.splice(i,1); chTouch();
  if ((wait.length || lodge.length) && confirm(`${nm} の動画が、改め待ちに${wait.length}本・宿場に${lodge.length}本ある。これも外す?\n(外さなければ、そのまま残る)`)){
    for (const v of [...wait, ...lodge]){ v.state = "dropped"; v.dropReason = "unsubscribed"; v.touched = true; }
    touch(); snapStock(); kTouch();
  }
  render();
}

async function resolve(q){
  q = q.trim();
  const direct = q.match(/(UC[\w-]{22})/);
  if (direct) return {id:direct[1]};

  const key = localStorage.getItem(LS+":ytkey");
  if (!key) throw new Error("UC…形式のIDを貼るか、接続画面でAPIキーを入れる");

  const vid = q.match(/(?:v=|youtu\.be\/|shorts\/)([\w-]{11})/);
  const url = vid
    ? `https://www.googleapis.com/youtube/v3/videos?part=snippet&id=${vid[1]}&key=${key}`
    : `https://www.googleapis.com/youtube/v3/channels?part=snippet&forHandle=@${
        (q.match(/@([\w.\-]+)/) || [,q.replace(/^@/,"")])[1]}&key=${key}`;

  const d = await (await fetch(url)).json();
  if (d.error) throw new Error(d.error.message);
  const it = d.items?.[0];
  if (!it) throw new Error("見つからない");
  return vid
    ? {id:it.snippet.channelId, name:it.snippet.channelTitle}
    : {id:it.id, name:it.snippet.title};
}

function importCsv(text){

  for (const line of text.split(/\r?\n/).slice(1)){
    const m = line.match(/(UC[\w-]{22})/);
    if (!m || cfg.channels.some(c => c.id === m[1])) continue;

/* ── 記録 ──────────────────────────────── */
function drawLog(){
  // 視聴済みは watched.json(退避済み)と stock の当日分を合わせて見る
  const w = [...Object.values(watched.videos||{}), ...list("watched")]
    .filter(v => v.post?.score);

  // 裁いた回数は月次の集計から積み上げる。却下した動画そのものはもう残っていない
  const T = {dropped:0, seen:0, watched:0, expired:0, pushed:0, full:0};
  for (const month of Object.values(stats||{}))
    for (const ch of Object.values(month))
      for (const k in T) T[k] += ch[k] || 0;
  for (const v of list("dropped"))
    T[{expired:"expired", pushed:"pushed", full:"full"}[v.dropReason] || "dropped"]++;
  for (const v of list("seen")) T.seen++;

  const everPicked = T.watched + T.expired + T.pushed + T.full;
  const judged = everPicked + T.dropped;          // 既視聴は分母に入れない

  const mean = a => a.reduce((x,y)=>x+y,0) / (a.length||1);
  const pre = w.map(v => v.score ?? 0), post = w.map(v => v.post.score);
  let r = NaN;
  if (w.length >= 5){
    const mp = mean(pre), mq = mean(post);
    const cov = mean(pre.map((x,i)=>(x-mp)*(post[i]-mq)));
    const sp = Math.sqrt(mean(pre.map(x=>(x-mp)**2)));
    const sq = Math.sqrt(mean(post.map(x=>(x-mq)**2)));
    r = (sp && sq) ? cov/(sp*sq) : NaN;
  }
  const grp = f => { const a = w.filter(f).map(v => v.post.score);
                     return a.length ? `${mean(a).toFixed(2)} (${a.length})` : "—"; };

  const stat = (l, v, note) =>
    `<div class="stat"><span>${l}<small>${note}</small></span><span class="v">${v}</span></div>`;

  const by = {};
  for (const v of w) (by[v.channelName || v.channelId] ||= []).push(v.post.score);
  const rows = Object.entries(by).sort((a,b)=>mean(b[1])-mean(a[1]))
    .map(([n,a]) => `<tr><td>${esc(n)}</td><td class="n">${a.length}</td>
      <td class="n">${mean(a).toFixed(1)}</td></tr>`).join("");

  const SEC = {};
  SEC.all = () =>
    stat("視聴後の平均", w.length ? mean(post).toFixed(2) : "—",
         `${w.length}本。結果を映すだけの数字。厳しくすれば上がるので目標にはしない`) +
    stat("予測との相関", isNaN(r) ? "—" : r.toFixed(2),
         "視聴前スコアが満足度を当てられているか。5本以上で出る。低いなら重みが間違っている") +
    stat("通過率", judged ? Math.round(everPicked/judged*100)+"%" : "—",
         `裁いた${judged}本のうち採用した割合。下がってきたらチャンネルが劣化している`) +
    stat("予測ズレ率", judged ? Math.round(T.expired/judged*100)+"%" : "—",
         "採用したのに期限切れで落ちた割合。見たい気がしただけの分") +
    stat("途中離脱率", w.length ? Math.round(w.filter(v=>v.post.bailed).length/w.length*100)+"%" : "—",
         "見始めてから期待外れで切った割合。ここが高いなら引きに釣られている") +
    stat("枠に押し出された", T.pushed + T.full || "0",
         "他の動画に負けた数。多いなら枠が狭いか、採用が甘い") +
    "";
  SEC.src = () => `<h3 style="margin:6px 0 0;font-size:14px">拾い方べつの満足度</h3>` +
    stat("新着から", grp(v => !v.manual && !v.daily && !v.rerun), "ふるいを流れてきたもの") +
    stat("自分で追加", grp(v => v.manual), "共有や貼り付けで拾ったもの。自分の選球眼") +
    stat("今日の1本", grp(v => v.daily), "過去動画からのランダム") +
    stat("再放送", grp(v => v.rerun), "昔5を付けたものの再評価") +
    stat("探索枠", grp(v => v.explore), "ランキングを無視して引き上げたもの");
  SEC.pred = () => predHtml(w) + diagnose(w);
  SEC.chan = () => rows ? `<table><tr><th>チャンネル</th><th style="text-align:right">本数</th>
      <th style="text-align:right">平均</th></tr>${rows}</table>` : `<p class="meta">まだない</p>`;
  if (!SEC[logSeg]) logSeg = "all";
  $("#view").innerHTML = segBar([["all", "全体"], ["src", "拾い方"], ["pred", "予想"], ["chan", "チャンネル"]], logSeg, "setLogSeg") + SEC[logSeg]();
}
let logSeg = "all";

// 改めの5問(見る前の予想)が、見たあとの評価とどれだけ合っているか
function predHtml(w){
  const MAP = { fun: "fun", match: "quality", learn: "learn", rest: "rest", fill: "after" };
  const rows = PRE_Q.map(([k, l]) => { const P = w.filter(v => v.pre && v.pre.items && v.pre.items[k] != null && v.post && v.post[MAP[k]] != null);
    const a = P.map(v => v.pre.items[k]), b = P.map(v => v.post[MAP[k]]), r = corr(a, b), gap = P.length ? P.reduce((s, v, i) => s + (b[i] - a[i]), 0) / P.length : NaN;
    return `<tr><td>${esc(l)}</td><td class="n">${P.length}</td><td class="n">${isNaN(r) ? "—" : r.toFixed(2)}</td><td class="n">${isNaN(gap) ? "—" : (gap > 0 ? "+" : "") + gap.toFixed(2)}</td></tr>`; }).join("");
  return `<h3 style="margin:6px 0 0;font-size:14px">改めの5問の当たり具合</h3><table><tr><th>問い</th><th style="text-align:right">本数</th><th style="text-align:right">結びつき</th><th style="text-align:right">ずれ</th></tr>${rows}</table>
    <p class="meta">結びつき=予想が高いほど、見たあとも高いか(1に近いほど当たる。6本以上で出る)。ずれ=見たあと − 予想の平均(+なら予想が低すぎ、−なら高すぎ)。</p>`;
}

/* 各パラメータが、実際に満足度を当てられていたかを見る。
   期待と引きの相関が高ければ、2つは同じものを測っている。 */
const corr = (a, b) => {
  const n = a.length;
  if (n < 6) return NaN;
  const m = x => x.reduce((p,q)=>p+q,0)/n;
  const ma = m(a), mb = m(b);
  const sa = Math.sqrt(m(a.map(x=>(x-ma)**2))), sb = Math.sqrt(m(b.map(x=>(x-mb)**2)));
  return (sa && sb) ? m(a.map((x,i)=>(x-ma)*(b[i]-mb))) / (sa*sb) : NaN;
};

function diagnose(w){
  const have = w.filter(v => v.pre);
  const y = have.map(v => v.post.score);
  const col = {
    "期待":     have.map(v => v.pre.expect ?? 3),
    "引き":     have.map(v => v.pre.pull ?? 3),
    "信頼度":   have.map(v => trustOf(v)),
    "鮮度":     have.map(v => freshOf(v)),
    "再生数比": have.map(v => viewsOf(v)),
    "再生時間": have.map(v => v.duration || 0),
  };
  const dup = corr(col["期待"], col["引き"]);
  const fmt = x => isNaN(x) ? "—" : (x >= 0 ? " " : "") + x.toFixed(2);

  const rows = Object.entries(col).map(([k, xs]) => {
    const r = corr(xs, y);
    const bar = isNaN(r) ? "" :
      `<i style="width:${Math.min(100, Math.abs(r)*100)}%;${r<0?"background:var(--clay)":""}"></i>`;
    return `<tr><td>${k}</td><td class="n">${fmt(r)}</td>
      <td style="width:45%"><div class="rbar">${bar}</div></td></tr>`;
  }).join("");

  const verdict = isNaN(dup) ? `視聴済みが ${have.length} 本。6本を超えると出る`
    : dup >= .8 ? `期待と引きの相関は ${fmt(dup)}。<b>ほぼ同じものを測っている。</b>
        掛け算に分けている意味がないので、引きの重みを落として他の項に回したほうがいい`
    : dup >= .5 ? `期待と引きの相関は ${fmt(dup)}。重なりはあるが別物として機能している`
    : `期待と引きの相関は ${fmt(dup)}。<b>独立した2つの軸として効いている。</b>この分け方は当たり`;

  return `<h3 style="margin:24px 0 2px;font-size:14px">パラメータの診断</h3>
    <p class="meta" style="margin-bottom:8px">各項と視聴後評価の相関。0に近い項は、重みを下げてよい</p>
    <table class="diag">${rows}</table>
    <p class="meta" style="margin-top:10px">${verdict}</p>`;
}

/* ══ 動画を手で拾う ════════════════════════════
   YouTubeアプリの共有シート、または貼り付け欄から1本ずつ足す。
   新着の流れとは別で、見つけた瞬間の「これ見たい」を在庫に入れる口。 */

const VID = /(?:youtu\.be\/|v=|shorts\/|live\/|embed\/)([\w-]{11})/;

function videoIdFrom(s){
  const m = (s || "").match(VID);
  if (m) return m[1];
  const bare = (s || "").trim();
  return /^[\w-]{11}$/.test(bare) ? bare : null;
}

async function addVideo(raw, fallbackTitle){
  const id = videoIdFrom(raw);
  if (!id) throw new Error("動画URLが読み取れない");
  if (stock.videos[id]){
    const v = stock.videos[id];
    const where = {fresh:"寝かせ中", pool:"ふるい待ち", picked:"ランキング",
                   watched:"視聴済み", seen:"既視聴", dropped:"却下済み"}[v.state] || v.state;
    throw new Error(`もう在庫にある(${where})`);
  }

  let meta = {title: fallbackTitle || id, channelName: "", channelId: "",
              published: new Date().toISOString(), duration: null};

  const key = localStorage.getItem(LS+":ytkey");
  if (key){
    try {
      const d = await (await fetch(
        `https://www.googleapis.com/youtube/v3/videos?part=snippet,contentDetails`
        + `&id=${id}&key=${key}`)).json();
      const it = d.items?.[0];
      if (it){
        meta = {
          title: it.snippet.title,
          channelName: it.snippet.channelTitle,
          channelId: it.snippet.channelId,
          published: it.snippet.publishedAt,
          duration: isoSec(it.contentDetails.duration),
        };
      }
    } catch(e){ console.warn("メタ取得できず", e); }
  }

  const newChan = meta.channelId && !cfg.channels.some(c => c.id === meta.channelId)
    ? {id: meta.channelId, name: meta.channelName} : null;

  stock.videos[id] = {
    id, ...meta, desc: "", newChan,
    added: new Date().toISOString(),
    state: "pool",              // 自分で選んだものは寝かせず、すぐふるいに出す
    type: ch(meta.channelId).defaultType || null,
    pre: null, score: null, post: null,
    watchedAt: null, explore: false, manual: true, touched: true,
  };
  touch();
  return stock.videos[id];
}

function isoSec(s){
  const m = (s||"").match(/P(?:(\d+)D)?T?(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/);
  if (!m) return null;
  const [d,h,mi,se] = m.slice(1).map(x => +x || 0);
  return d*86400 + h*3600 + mi*60 + se;
}

/* 共有シートから来たとき。manifest の share_target が
   ?title=...&text=...&url=... を付けてここに飛ばしてくる。 */
const CHAN = /youtube\.com\/(?:channel\/(UC[\w-]{22})|@([\w.\-]+)|c\/([\w.\-]+)|user\/([\w.\-]+))/;

async function handleShare(){

  const isVideo = !!videoIdFrom(raw);

  try {
    if (isChan){
      const c = await resolve(raw);                    // @ハンドルはAPIキーで解決する
      if (cfg.channels.some(x => x.id === c.id)) throw new Error("もう登録してある");
      cfg.channels.push({id:c.id, name:c.name || c.id, defaultType:"focus"});
      chTouch();

/* ══ 関所 ════════════════════════════════════
   見る時間を、自分の記録で絞る。
   門(開門・閉門の時刻)・通行手形(1日の総時間。見ると減る)・損切り(その日の評価が落ちたら閉める)・
   改めの線(宿場に通す点数。在庫から自動で動く)。記録は docs/data/sekisho.json(アプリだけが書く) */
const KPATH = "docs/data/sekisho.json";
const KVER = "2026-10-17 s23";      // 画面に出す版(最新になったかを確かめる)
const KDEF = {
  version: 1,
  settings: {
    allowance: 120,                 // 通行手形(分)。最初はでたらめでいい。記録から自動で直る
    gates: {0:["00:00","24:00"],1:["00:00","24:00"],2:["00:00","24:00"],3:["00:00","24:00"],4:["00:00","24:00"],5:["00:00","24:00"],6:["00:00","24:00"]},
    stopN: 2, warm: 3,              // 損切り:何本続けて下回ったら閉めるか/最初の何本は閉めないか
    target: 0.5,                    // 目標の在庫 = 通行手形 × この値
    gain: 1,                        // 改めの線の反応の速さ
    window: 3,                      // 在庫の平均をとる日数
    approach: 0.5,                  // (前の版の値。今は使わない)
    rate: 0.2,                      // 通行手形が、1日に目標へ近づく割合(差の2割)
    trialOffset: null,              // 試しの日を、7日のうちどの日にするか(はじめて使うときに決まる)
    threshold: 55,                  // 改めの線(この点以上が宿場に通る)
    tighten: 0,                     // 引き締め(0〜0.5)。実際の手形 = 自然な手形 ×(1 − 引き締め)
    natural: null,                  // 自然な手形(有効時間の境目から自動で決まる値)
    tags: ["テスト前", "寝不足", "塾の日"],
    lastAdjust: null, lastWeekly: null
  },
  days: {},
  games: [],                        // 遊戯(自分で登録するゲーム)
  hist: { allowance: [], threshold: [], settings: [] }
};
let seki = JSON.parse(JSON.stringify(KDEF)), sekiSha = null, sekiDirty = false;
const kNow = () => (window.__kNow || Date.now());
const kDay = (t) => { const d = new Date((t || kNow()) + 9 * 3600e3 - 4 * 3600e3); return d.toISOString().slice(0, 10); };   // 朝4時で日付を切る
const kAddDays = (d, n) => new Date(Date.parse(d + "T00:00:00Z") + n * 864e5).toISOString().slice(0, 10);
const kMin = s => Math.round((s || 0) / 60);
const kmean = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : NaN;
function kNorm(o){
  const x = Object.assign(JSON.parse(JSON.stringify(KDEF)), o || {});
  x.settings = Object.assign(JSON.parse(JSON.stringify(KDEF.settings)), (o && o.settings) || {});
  x.days = x.days || {}; x.games = x.games || []; x.hist = Object.assign({ allowance: [], threshold: [], settings: [] }, x.hist || {});
  return x;
}
function kTouch(){ sekiDirty = true; cache("seki", seki); _kTouch(); flag(); }
function today(){ const d = kDay(); return seki.days[d] || (seki.days[d] = { sessions: [], watchedSec: 0 }); }

/* ── 門 ── */
const hm2min = s => { const [h, m] = String(s || "0:0").split(":").map(Number); return h * 60 + (m || 0); };
function nowMinOfDay(t){ const d = new Date((t || kNow()) + 9 * 3600e3); return d.getUTCHours() * 60 + d.getUTCMinutes(); }
function weekdayJST(t){ return new Date((t || kNow()) + 9 * 3600e3).getUTCDay(); }
function gateTimes(t){ return (seki.settings.gates || {})[weekdayJST(t)] || ["00:00", "24:00"]; }
// 自然な手形と、引き締めをかけた実際の手形
const naturalMin = () => seki.settings.natural != null ? seki.settings.natural : seki.settings.allowance;
const r5 = x => Math.round(x / 5) * 5;
function applyTighten(){ const n = naturalMin(); if (n == null) return; seki.settings.allowance = Math.max(5, r5(n * (1 - Math.min(0.5, Math.max(0, +seki.settings.tighten || 0))))); }
// 試しの日:週に1日、手形を4分の1広げて、手形の先の記録をとる
function isTrialDay(day){ const s = seki.settings; if (s.trialOffset == null) s.trialOffset = Math.floor(Math.random() * 7);
  const n = Math.floor(Date.parse((day || kDay()) + "T00:00:00Z") / 864e5); return ((n % 7) + 7) % 7 === s.trialOffset; }
function todayAllowance(){ const a = seki.settings.allowance; if (a == null) return null; return isTrialDay() ? r5(a * 1.25) : a; }
function remainSec(){ const a = todayAllowance(); if (a == null) return Infinity; return Math.max(0, a * 60 - (today().watchedSec || 0)); }
// 閉門までの残り(秒)
function toCloseSec(){ const [, c] = gateTimes(); return Math.max(0, (hm2min(c) - nowMinOfDay()) * 60); }
// 今、見られるか。見られないなら理由
function gate(){
  const d = today();
  if (d.closed) return { open: false, why: d.closed.reason, at: d.closed.at };
  const [o, c] = gateTimes(), m = nowMinOfDay();
  if (m < hm2min(o)) return { open: false, why: "開門前", next: o };
  if (m >= hm2min(c)) return { open: false, why: "閉門の時刻", next: null };
  if (remainSec() <= 0) return { open: false, why: "手形切れ" };
  return { open: true, remain: remainSec(), closeAt: c };
}
// 次に門が開く日時(今日まだ開門前なら今日、そうでなければ明日の開門。明日から効く予約の時刻も見る)
function nextOpen(){
  const g = gate(); if (g.open) return null;
  const t = kNow(), wd = weekdayJST(t), [o] = gateTimes(t);
  if (g.why === "開門前") return { when: "今日", time: o };
  const tw = (wd + 1) % 7, pg = seki.pending && seki.pending.changes && seki.pending.changes.gates;
  const tg = (pg && pg[tw]) || (seki.settings.gates || {})[tw] || ["00:00", "24:00"];
  return { when: "明日(" + "日月火水木金土"[tw] + ")", time: tg[0] === "24:00" ? "00:00" : tg[0] };
}
function closeGate(reason){ const d = today(); if (!d.closed) { d.closed = { reason, at: new Date(kNow()).toISOString() }; kTouch(); } }

/* ── 見たことの記録(1回の視聴=1つの区切り) ──
   s = { id, start, end, secs, startCum, effect, more, quality, reason, part } */
function addSession(s){
  const d = today(), remBefore = remainSec();
  if (remBefore !== Infinity && (s.secs || 0) > remBefore + 30) { d.overSec = (d.overSec || 0) + Math.round((s.secs || 0) - remBefore); s.over = Math.round((s.secs || 0) - remBefore); }
  s.startCum = s.startCum != null ? s.startCum : (d.watchedSec || 0);

/* ── 損切り:最初の数本のあと、心への効きか「もう一本見たい」が、ふだんの散らばりの半分以上

   平均は、その日のそれまでの分に、直近14日の自分の平均を混ぜる(1日の最初の数本だけで決まらないように)。

    if (x.more != null && m && x.more < m.cut) why.push("もう一本見たいが平均(" + m.base.toFixed(1) + ")より" + (m.base - x.more).toFixed(1) + "下がった");

  return false;
}

/* ── 宿場の在庫(秒)と、その日の値動き ── */
// 宿場の在庫(秒)。連載は少しずつ見る別の棚なので、在庫の調整には数えない
function stockSec(){ return list("picked").filter(v => !(v.serial || v.type === "serial")).reduce((a, v) => a + Math.max(0, (v.duration || 0) - (v.progress || 0)), 0); }

/* ── 有効時間の境目:その日の何分目かを30分ごとに区切り、心への効きが自分の平均を2区切り続けて下回る最初の区切り ── */
function sessionsSince(days){
  const from = kAddDays(kDay(), -days), out = [];
  for (const [d, x] of Object.entries(seki.days)) if (d >= from) (x.sessions || []).forEach(s => { if (s.effect != null) out.push(Object.assign({ day: d }, s)); });
  return out;
}
function effectCurve(){
  const S = sessionsSince(28), all = kmean(S.map(s => s.effect)), bins = {};

  const rows = Object.keys(bins).map(Number).sort((a, b) => a - b).map(b => ({ b, n: bins[b].length, avg: kmean(bins[b]) }));

}

    if (r.avg < all && (!nx || nx.avg < all) && (nx || i > 0)) return r.b * 30;
  }
  return "above";    // どこも下回らない(上限の近くでも楽しめている)
}

/* ── 下限:見た時間の組ごとの心の余裕を、自分で付けた印の影響を除いて比べる ── */
function moodRows(){
  const D = Object.entries(seki.days).filter(([, x]) => x.mood && x.mood.v != null).map(([d, x]) => ({ d, v: x.mood.v, tags: x.mood.tags || [], min: kMin(x.watchedSec) }));
  // 印ごとの影響 = 印のある日の平均 − ない日の平均(3日以上あるときだけ)
  const eff = {};
  for (const t of seki.settings.tags || []) { const w = D.filter(x => x.tags.includes(t)), wo = D.filter(x => !x.tags.includes(t)); if (w.length >= 3 && wo.length >= 3) eff[t] = kmean(w.map(x => x.v)) - kmean(wo.map(x => x.v)); }
  D.forEach(x => { x.adj = x.v - x.tags.reduce((a, t) => a + (eff[t] || 0), 0); });
  return { D, eff, all: kmean(D.map(x => x.adj)) };
}

  const { D, all } = moodRows(); if (D.length < 6) return null;
  const bins = {}; D.forEach(x => { const b = Math.floor(x.min / 30); (bins[b] = bins[b] || []).push(x.adj); });
  const rows = Object.keys(bins).map(Number).sort((a, b) => a - b).map(b => ({ b, n: bins[b].length, avg: kmean(bins[b]) })).filter(r => r.n >= 3);
  if (!rows.length) return null;
  const first = rows.find(r => r.avg >= all);
  return first ? first.b * 30 : null;
}

/* ── 自動調整(日をまたいで最初に開いたときに、前の日のぶんを) ── */
function totalRated(){ return Object.values(seki.days).reduce((a, x) => a + (x.sessions || []).filter(s => s.effect != null).length, 0); }
// 境目の見積もり:その日の何分目かと心への効きに、まっすぐな線を当てはめ、自分の平均を下回る時刻を出す。
// 見積もりで増やせるのは、実際に見たことのある時刻(試しの日を含む)まで。線が下がらないときは、そこを追いかける
function boundaryEst(){
  const S = sessionsSince(28).filter(s => s.effect != null); if (S.length < 6) return null;
  const xs = S.map(s => (s.startCum || 0) / 60), ys = S.map(s => s.effect), n = S.length;
  const mx = kmean(xs), my = kmean(ys), sxx = xs.reduce((a, x) => a + (x - mx) ** 2, 0), sxy = xs.reduce((a, x, i) => a + (x - mx) * (ys[i] - my), 0);
  const reach = Math.max(...S.map(s => ((s.startCum || 0) + (s.secs || 0)) / 60));     // 実際に見たことのあるいちばん先(分)
  if (!sxx) return { min: reach, how: "still", reach };
  const slope = sxy / sxx;
  if (slope < 0) {
    // 線は必ず平均の位置で平均と交わるので、「ふだんの散らばりの半分だけ平均より下がる時刻」を境目とする
    const sd = Math.sqrt(ys.reduce((a, y) => a + (y - my) ** 2, 0) / Math.max(1, n - 1)), at = mx + (-sd * 0.5) / slope;
    const est = Math.max(5, at);

// 心の余裕の頭打ち:見た時間ごとの心の余裕(印の影響を除く)が、いちばん高い組とほぼ同じになる、いちばん短い時間

  const rows = Object.keys(bins).map(Number).sort((a, b) => a - b).map(b => { const a = bins[b], m = kmean(a), sd = a.length > 1 ? Math.sqrt(a.reduce((s, v) => s + (v - m) ** 2, 0) / (a.length - 1)) : 0; return { b, n: a.length, avg: m, se: sd / Math.sqrt(a.length) }; }).filter(r => r.n >= 3);

    if (be.est < nat) { target = be.est; why = "有効時間の境目の見積もり(" + Math.round(be.est) + "分)"; }
    else if (be.reach > nat) { target = be.reach; why = "境目の見積もりは" + Math.round(be.est) + "分だが、確かめたのは" + Math.round(be.reach) + "分まで"; }

function adjustThreshold(reasonDay){

// 予約した設定の変更:次の日の朝4時から効く(その日の決まりは、朝に決まったまま変わらない)
const KEYS_PENDING = ["stopN", "warm", "threshold", "target", "gain", "window", "rate", "gates"];

/* ── 改め:1本ずつ。予想を5問で付け、線を超えたら宿場へ ── */

  if (!pool.length) return $("#view").innerHTML = box + `<div class="empty"><b>改めるものがない</b>寝かせ中が${list("fresh").length}本。期間が明けたらここに出てくる。</div>` + droppedHtml();

    ${vgridHtml("pre", PRE_Q, pre, Object.fromEntries(PRE_Q.map(q => [q[0], true])))}
    <div class="row"><span>見込み</span><span id="pre-live" data-id="${v.id}" class="live num">${scoreOf(v, preObj(pre)).toFixed(0)}</span><span class="meta" style="margin-left:6px">線 ${th}</span></div>
    ${v.newChan ? `<p class="meta" style="margin-top:8px"><button class="addch" onclick="addChanOf('${v.id}')">+ ${esc(v.newChan.name || v.newChan.id)} を登録して、新着も拾う</button></p>` : ""}
    <div class="verdict"><button class="seen" onclick="judge('${v.id}','seen')">もう見た</button><button class="take" id="judge-btn" onclick="judge('${v.id}','auto')">改める</button></div>

  judgeLabel(scoreOf(v, preObj(pre)));
}
// 保留:迷うときは横に置いて先に進み、思いついたら「今改める」で前に出す
function holdIt(id){ const v = stock.videos[id]; if (!v) return; snap(v); v.hold = true; v.heldAt = new Date(kNow()).toISOString(); delete v.front; v.touched = true; touch(); kse("pluck"); $("#msg").textContent = "保留した。保留(◯本)から、いつでも改められる"; render(); }
function unhold(id){ const v = stock.videos[id]; if (!v) return; v.hold = false; v.front = new Date(kNow()).toISOString(); v.touched = true; touch(); kse("unlock"); render(); }
function heldHtml(curId){

// 落ちた動画(次の朝の収集で片付けられるまで、ここから取り戻せる)
const DROP_WHY = { below: "線より下", skipped: "落とした", gaveup: "宿場から外した", unsubscribed: "チャンネルを外した", pushed: "押し出された", full: "枠がいっぱい", expired: "期限切れ" };
function droppedHtml(){
  const ds = list("dropped").sort((a, b) => (b.touched ? 1 : 0) - (a.touched ? 1 : 0)).slice(0, 20);
  if (!ds.length) return "";
  return `<details class="dropped"><summary>落ちた動画(${list("dropped").length}本)</summary><p class="meta">次の朝の収集で片付けられるまで、ここから取り戻せる</p>` + ds.map(v => `<div class="item"><div class="body">
      <span class="dt">${esc(v.title)}</span><p class="meta">${esc(v.channelName || "")} ・ ${DROP_WHY[v.dropReason] || "落ちた"}${v.score != null ? ` ・ ${(+v.score).toFixed(0)}点` : ""}</p>
      <div class="acts"><button onclick="revive('${v.id}','picked')">宿場に通す</button><button onclick="revive('${v.id}','pool')">改めに戻す</button></div></div></div>`).join("") + `</details>`;
}
function revive(id, to){
  const v = stock.videos[id]; if (!v) return; snap(v);
  v.state = to; delete v.dropReason; v.touched = true;

  if (to === "picked") { v.pickedAt = new Date(kNow()).toISOString(); if (v.score == null) v.score = scoreOf(v); }
  touch(); snapStock(); kTouch(); kse(to === "picked" ? "levelup" : "unlock");

function judge(id, how){
  const v = stock.videos[id], items = Object.assign(predictPre(v), readSliders("pre")), pre = preObj(items), score = scoreOf(v, pre), th = seki.settings.threshold;
  snap(v);
  if (how === "seen") { v.state = "seen"; v.touched = true; touch(); render(); return; }

  if (how === "serial") { v.serial = true; v.type = "serial"; }
  v.pre = pre; v.score = score; v.touched = true; delete v.hold; delete v.heldAt; delete v.front;

  else { v.state = "dropped"; v.dropReason = how === "drop" ? "skipped" : "below"; }
  touch(); snapStock(); kTouch();
  $("#msg").textContent = pass ? `通った(${score.toFixed(0)}点)` : `落ちた(${score.toFixed(0)}点 < 線 ${th})`; kse(pass ? "levelup" : "down");
  render();
}

/* ── 宿場:通った動画。点数の高い順 ── */
function drawRank(){
  const serials = list("picked").filter(isSerial).sort((a, b) => Date.parse(b.watchedPartAt || b.pickedAt || 0) - Date.parse(a.watchedPartAt || a.pickedAt || 0));
  let all = list("picked").filter(v => !isSerial(v)); all.forEach(v => v.score = scoreOf(v)); all.sort((a, b) => b.score - a.score);
  const shown = [], rest = all.slice();
  while (rest.length) { if (shown.length && shown.length % 5 === 4 && rest.length > 2) { const i = Math.floor(rest.length / 2 + Math.random() * rest.length / 2), p = rest.splice(i, 1)[0]; p.explore = true; shown.push(p); } else { const t = rest.shift(); t.explore = false; shown.push(t); } }
  const g = gate(), rem = remainSec();
  const serialNote = serials.length ? `<p class="meta" style="margin:-4px 0 6px">連載 ${serials.length} 本は、連載のタブにある</p>` : "";

}

      return `<div class="item serial"><span class="rank">◷</span><div class="body"><a href="javascript:void 0" onclick="${g.open ? `play('${v.id}')` : ""}">${esc(v.title)}</a>
        <p class="meta">${hhmm(v.progress || 0)} / ${hhmm(v.duration)} ・ ${pct}%</p><div class="capbar" style="margin:4px 0"><i style="width:${pct}%"></i></div>
        <div class="acts">${g.open ? `<button onclick="play('${v.id}')">続きを見る</button><button onclick="openExt('${v.id}')">YouTubeで見る</button>` : `<span class="meta">${esc(g.why)}</span>`}<button class="off" onclick="setSerial('${v.id}',false)">連載から外す</button></div></div></div>`; }).join("") +

function rankList(shown, g, rem){

        <div class="acts">${g.open ? `<button onclick="play('${v.id}')">ここで見る</button><button onclick="openExt('${v.id}')">YouTubeで見る</button>` : `<span class="meta">${esc(g.why)}</span>`}<button onclick="setSerial('${v.id}',true)">連載にする</button><button onclick="revive('${v.id}','pool')">改めに戻す</button><button class="off" onclick="drop('${v.id}')">外す</button></div>
      </div><span class="sc">${v.score.toFixed(0)}</span></div>`; }).join("")
      : `<div class="empty"><b>宿場が空</b>改めを通った動画がまだない。合うものがないときは、見ないのが正しい。</div>`);

const b64enc = s => { const b = new TextEncoder().encode(s); let o = "";
  for (let i=0;i<b.length;i+=0x8000) o += String.fromCharCode(...b.subarray(i,i+0x8000));
  return btoa(o); };
const b64dec = s => new TextDecoder().decode(
  Uint8Array.from(atob(s.replace(/\s/g,"")), c => c.charCodeAt(0)));

const conn = () => JSON.parse(localStorage.getItem(LS+":conn") || "null");

const safeParse = (s, fb) => { try { return JSON.parse(s ?? ""); } catch { return fb; } };

async function api(path, opt={}){
  const c = conn();
  if (!c || !c.repo || !c.token) throw new Error("リポジトリ名かトークンが空");
  if (!/^[\w.-]+\/[\w.-]+$/.test(c.repo)) throw new Error(`リポジトリ名の形式が変: "${c.repo}"`);

  let r;
  try {
    r = await fetch(`https://api.github.com/repos/${c.repo}/contents/${path}`, {
      ...opt, headers:{Authorization:`Bearer ${c.token}`,
                       Accept:"application/vnd.github+json", ...opt.headers}
    });
  } catch(e){ throw new Error("通信できず(ネットワークかURL): " + e.message); }

  const body = await r.text();                 // 空でも落ちないよう先に文字列で受ける
  if (!r.ok){
    const detail = body ? (safeParse(body, {}).message || body.slice(0,120)) : "(本文なし)";
    const hint = {401:"トークンが無効か期限切れ",
                  403:"権限不足。Contents が Read and write か確認",
                  404:"リポジトリ名かファイルのパスが違う、またはトークンがこのリポジトリを見られない"}[r.status] || "";
    throw new Error(`${r.status} ${hint} / ${detail}`);
  }
  return body ? JSON.parse(body) : {};
}

/* Contents API は約1MBを超えるとメタ情報だけ返し content を空にする。
   その場合は raw で本体だけ取り直す(sha は先の応答のものを使う)。 */
async function readJson(path){
  const f = await api(path);
  if (f.content) return {sha:f.sha, data:JSON.parse(b64dec(f.content))};

  const c = conn();
  const r = await fetch(`https://api.github.com/repos/${c.repo}/contents/${path}`, {
    headers:{Authorization:`Bearer ${c.token}`, Accept:"application/vnd.github.raw"}
  });
  if (!r.ok) throw new Error(`raw取得に失敗 ${r.status}`);
  const text = await r.text();
  if (!text) throw new Error(`${path} が空で返ってきた`);
  return {sha:f.sha, data:JSON.parse(text)};
}

function mergeLocal(remote){
  const local = safeParse(localStorage.getItem(LS+":stock"), null);
  if (!local) return remote;
  for (const [id, lv] of Object.entries(local.videos || {})){
    if (!lv.touched) continue;
    if (!remote.videos[id]) { remote.videos[id] = lv; continue; }
    Object.assign(remote.videos[id], {
      type:lv.type, pre:lv.pre, score:lv.score, post:lv.post, state:lv.state,
      watchedAt:lv.watchedAt, pickedAt:lv.pickedAt, progress:lv.progress,
      dropReason:lv.dropReason, explore:lv.explore, touched:true
    });
  }
  return remote;
}

async function put(path, obj, curSha){
  const res = await api(path, {method:"PUT", body:JSON.stringify({
    message: "sieve: " + new Date().toISOString().slice(0,10),
    content: b64enc(JSON.stringify(obj, null, 1)), sha: curSha
  })});
  return res.content.sha;
}
